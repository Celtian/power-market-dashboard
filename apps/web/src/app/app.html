<div class="flex min-h-screen flex-col">
  <header
    class="sticky top-0 z-20 border-b border-primary-400 surface-300 shadow-md dark:border-secondary-600 dark:surface-800"
  >
    <div
      class="mx-auto grid h-14 w-full max-w-screen-2xl grid-cols-[minmax(0,1fr)_auto] items-center gap-2 px-4 sm:px-6"
    >
      <div class="flex items-center">
        <a
          class="flex h-14 items-center px-2 focusable hover:surface-400 focus:outline-primary-500 dark:hover:surface-700 dark:focus:outline-primary-400"
          routerLink="/solar"
          [attr.aria-label]="'app.home' | transloco"
          [tooltipPosition]="['bottomRight', 'topRight']"
          [uiTooltip]="'app.home' | transloco"
        >
          <app-logo class="h-8" logoType="responsive" />
        </a>
      </div>

      <div class="flex justify-end gap-2">
        <button
          ui-button-icon
          data-language-toggle
          rounded="all"
          size="sm"
          type="button"
          [attr.aria-label]="languageToggleLabel()"
          [tooltipPosition]="['bottomLeft', 'topLeft']"
          [uiTooltip]="languageToggleLabel()"
          [withBorder]="true"
          (click)="toggleLanguage()"
        >
          <ui-flag aria-hidden="true" countryName="" [countryCode]="languageFlag()" />
        </button>

        <button
          ui-button-icon
          data-theme-toggle
          rounded="all"
          size="sm"
          type="button"
          [attr.aria-label]="themeToggleLabel()"
          [tooltipPosition]="['bottomLeft', 'topLeft']"
          [uiTooltip]="themeToggleLabel()"
          [withBorder]="true"
          (click)="theme.toggleTheme()"
        >
          <ng-icon class="size-4" aria-hidden="true" [name]="themeToggleIcon()" />
        </button>

        <button
          #navigationDropdown="uiDropdown"
          ui-button-icon
          class="hidden sm:inline-flex"
          id="header-navigation-trigger"
          type="button"
          data-header-navigation-trigger
          dropdownControls="header-navigation-panel"
          [attr.aria-label]="'app.navigation.open' | transloco"
          [uiDropdown]="navigationMenu"
          [tooltipPosition]="['bottomLeft', 'topLeft']"
          [uiTooltip]="'app.navigation.open' | transloco"
          [dropdownPosition]="['bottomLeft', 'topLeft']"
          [withBorder]="true"
          rounded="all"
          size="sm"
        >
          <ng-icon class="size-4" aria-hidden="true" name="faSolidBars" />
        </button>

        <ng-template #navigationMenu>
          <section
            uiDropdownPanel
            id="header-navigation-panel"
            class="w-48 p-2"
            aria-labelledby="header-navigation-trigger"
          >
            <nav class="flex flex-col" [attr.aria-label]="'app.navigation.primary' | transloco">
              <a
                class="flex items-center gap-2 rounded-sm px-3 py-2 font-medium focusable hover:surface-300 focus:outline-primary-700 dark:hover:surface-600 dark:focus:outline-primary-300"
                routerLink="/solar"
                routerLinkActive="surface-300 font-bold dark:surface-600"
                ariaCurrentWhenActive="page"
                (click)="navigationDropdown.close()"
              >
                <ng-icon class="size-4" aria-hidden="true" name="faSolidSun" />
                {{ 'app.navigation.solar' | transloco }}
              </a>
              <a
                class="flex items-center gap-2 rounded-sm px-3 py-2 font-medium focusable hover:surface-300 focus:outline-primary-700 dark:hover:surface-600 dark:focus:outline-primary-300"
                routerLink="/balancing"
                routerLinkActive="surface-300 font-bold dark:surface-600"
                ariaCurrentWhenActive="page"
                (click)="navigationDropdown.close()"
              >
                <ng-icon class="size-4" aria-hidden="true" name="faSolidScaleBalanced" />
                {{ 'app.navigation.balancing' | transloco }}
              </a>
            </nav>
          </section>
        </ng-template>
      </div>
    </div>
  </header>

  <div class="flex flex-1 flex-col" data-bottom-navigation-container>
    <main
      class="mx-auto flex w-full max-w-screen-2xl flex-1 flex-col p-4 sm:p-6"
      data-app-content
      role="main"
    >
      <router-outlet />
    </main>

    <footer
      class="border-t border-primary-400 surface-300 dark:border-secondary-600 dark:surface-800"
    >
      <div class="mx-auto w-full max-w-screen-2xl px-4 py-6 text-center text-sm sm:px-6">
        &copy; {{ currentYear }} Power Market Dashboard
      </div>
    </footer>
  </div>
</div>

<ui-bottom-navigation
  [ariaLabel]="'app.navigation.primary' | transloco"
  containerSelector="[data-bottom-navigation-container]"
  [mobileOnly]="true"
>
  <a ui-bottom-navigation-item routerLink="/solar">
    <ng-icon class="size-5" aria-hidden="true" name="faSolidSun" />
    <span class="max-w-full truncate">
      {{ 'app.navigation.solar' | transloco }}
    </span>
  </a>
  <a ui-bottom-navigation-item routerLink="/balancing">
    <ng-icon class="size-5" aria-hidden="true" name="faSolidScaleBalanced" />
    <span class="max-w-full truncate">
      {{ 'app.navigation.balancing' | transloco }}
    </span>
  </a>
</ui-bottom-navigation>

<button
  ui-button-icon
  ngxScrollTop
  class="fixed right-4 bottom-[calc(4.5rem+env(safe-area-inset-bottom))] z-40 sm:bottom-4"
  rounded="all"
  size="sm"
  type="button"
  [attr.aria-label]="'app.scroll-top' | transloco"
  [withBorder]="true"
>
  <ng-icon class="size-4" aria-hidden="true" name="faSolidChevronUp" />
</button>

<ui-sonner-toaster />
