<div class="flex min-w-0 items-center gap-3">
  <ng-content select="[modalHeaderLeading]" />
  <!-- prettier-ignore -->
  <h2 class="truncate text-xl font-semibold" [id]="titleId()">{{ modalTitle() }}</h2>
  <ng-content select="[modalHeaderMeta]" />
</div>

<div class="flex shrink-0 items-center gap-2">
  <ng-content select="[modalHeaderAction]" />
  @if (showCloseButton()) {
  <button
    ui-button-icon
    type="button"
    rounded="all"
    size="sm"
    [attr.aria-label]="i18n().modal.close"
    [withBorder]="true"
    (click)="closeClicked.emit()"
  >
    <ng-icon aria-hidden="true" name="faSolidXmark" />
  </button>
  }
</div>
